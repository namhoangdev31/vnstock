name: vistocks

services:
  backend:
    image: vistocks-backend:latest
    container_name: vistocks-backend
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${PORT_BACKEND:-8800}:8000"
    command: ${BACKEND_COMMAND:-fastapi run --workers 4 app/main.py}
    env_file:
      - .env
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Ho_Chi_Minh"
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      vistocks-network: {}
      sanauto-production-net:
        aliases:
          - vistocks-backend
          - vnstock-backend

  frontend:
    image: vistocks-frontend:latest
    container_name: vistocks-frontend
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${PORT_FRONTEND_PROD:-8801}:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.vidub.ai}
    networks:
      vistocks-network: {}
      sanauto-production-net:
        aliases:
          - vistocks-frontend
          - vnstock-frontend

networks:
  vistocks-network:
    name: vistocks-network
    driver: bridge
  sanauto-production-net:
    external: true
