name: vnstock

services:
  backend:
    image: vnstock-backend:latest
    container_name: vnstock-backend
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${PORT_BACKEND:-8800}:8000"
    command: ${BACKEND_COMMAND:-fastapi run --workers 4 app/main.py}
    env_file:
      - .env
    environment:
      FASTAPI_ENV: ${FASTAPI_ENV:-development}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: "Asia/Ho_Chi_Minh"
    build:
      context: .
      dockerfile: backend/Dockerfile
    networks:
      - vnstock-network
      - sanauto-production-net

  frontend:
    image: vnstock-frontend:latest
    container_name: vnstock-frontend
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "${PORT_FRONTEND_PROD:-8801}:80"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.vidub.ai}
    networks:
      - vnstock-network
      - sanauto-production-net

networks:
  vnstock-network:
    name: vnstock-network
    driver: bridge
  sanauto-production-net:
    external: true
