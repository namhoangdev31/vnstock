name: Mobile EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: 'Build Profile (EAS)'
        required: true
        default: 'preview'
        options:
          - preview
          - production
          - development
      platform:
        type: choice
        description: 'Target Platform'
        required: true
        default: 'android'
        options:
          - android
          - ios
          - all

jobs:
  eas-build:
    name: Trigger EAS Cloud Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/vnstock

    steps:
      - name: 🔐 Validate EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets['EXPO_TOKEN'] }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Thiếu secret EXPO_TOKEN. Vui lòng thêm EXPO_TOKEN vào Settings > Secrets của repo."
            exit 1
          fi

      - name: 📦 Checkout (Shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: ⚡ Setup Node & Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/vnstock/pnpm-lock.yaml

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 🚀 Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets['EXPO_TOKEN'] }}

      - name: 📱 Trigger EAS Cloud Build (--no-wait)
        # Sử dụng cờ --no-wait để thoát ngay sau khi gửi lệnh, không treo máy ảo chờ build (tiết kiệm 100% phút)
        run: |
          npx eas-cli build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
