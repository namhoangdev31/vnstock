name: Scheduled Daily Market Sync Cron

on:
  schedule:
    # 15:15 chiều Thứ Hai đến Thứ Sáu hàng tuần (Giờ Việt Nam UTC+7 = 08:15 UTC)
    - cron: '15 8 * * 1-5'
  workflow_dispatch:

jobs:
  sync-daily-market:
    name: Sync VNStock Daily Market Data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Daily Market Sync via API
        env:
          APP_URL: ${{ secrets.FASTAPI_CLOUD_APP_URL || 'https://vnstock.fastapicloud.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET_KEY || secrets.SECRET_KEY }}
        run: |
          echo "Bắt đầu gọi webhook đồng bộ nến ngày tới $APP_URL..."
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$APP_URL/api/v1/stock/cron/sync-daily-market" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS/d')

          echo "Response Body: $RESPONSE_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Lỗi: Đồng bộ thất bại với mã lỗi HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Đồng bộ nến ngày thị trường hoàn tất thành công!"
