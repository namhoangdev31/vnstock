name: Scheduled Symbols Sync Cron

on:
  schedule:
    # 08:00 sáng Thứ Hai & Thứ Năm hàng tuần (Giờ Việt Nam UTC+7 = 01:00 UTC)
    - cron: '0 1 * * 1,4'
  workflow_dispatch:

jobs:
  sync-symbols:
    name: Sync VNStock Symbols & Derivatives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Stock Symbols Sync via API
        env:
          APP_URL: ${{ secrets.FASTAPI_CLOUD_APP_URL || 'https://vnstock.fastapicloud.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET_KEY || secrets.SECRET_KEY }}
        run: |
          echo "Bắt đầu gọi webhook đồng bộ danh mục mã tới $APP_URL..."
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$APP_URL/api/v1/stock/cron/sync-symbols" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          RESPONSE_BODY=$(echo "$HTTP_RESPONSE" | sed '/HTTP_STATUS/d')

          echo "Response Body: $RESPONSE_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Lỗi: Đồng bộ thất bại với mã lỗi HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "Đồng bộ danh mục mã hoàn tất thành công!"
