name: Mobile CI

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'apps/vnstock/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

# Tự động hủy build cũ nếu push commit mới lên cùng PR
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Mobile Quality Checks (Lint, Type, Test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/vnstock

    steps:
      - name: 📦 Checkout (Shallow)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: ⚡ Setup Node & Cache Dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/vnstock/pnpm-lock.yaml

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 🔍 Lint & Type Check
        run: |
          pnpm run lint
          pnpm run type-check

      - name: 🧪 Unit Tests
        run: pnpm run test
