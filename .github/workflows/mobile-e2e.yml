name: Mobile E2E Tests (Maestro / Manual)

on:
  workflow_dispatch:
    inputs:
      test_mode:
        type: choice
        description: 'E2E Testing Mode'
        required: true
        default: 'maestro_cloud'
        options:
          - maestro_cloud
          - download_apk
      apk_url:
        type: string
        description: 'EAS APK URL (only needed for download_apk mode)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-cloud-test:
    name: Maestro Cloud E2E Test
    if: inputs.test_mode == 'maestro_cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🔐 Check Secret
        run: |
          if [ -z "${{ secrets.MAESTRO_CLOUD_API_KEY }}" ]; then
            echo "::error::Secret MAESTRO_CLOUD_API_KEY is not set. Please add it to repository secrets to run Maestro Cloud tests."
            exit 1
          fi

      - name: 📦 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node + PNPM
        uses: ./.github/actions/setup-node-pnpm-install
        with:
          working-directory: 'apps/vnstock'

      - name: 🤖 Build Test APK
        uses: ./.github/actions/setup-jdk-generate-apk
        with:
          APP_ENV: staging
          working-directory: 'apps/vnstock'

      - name: 📱 Run E2E Tests with Maestro Cloud
        uses: mobile-dev-inc/action-maestro-cloud@v1.4.1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: ./apps/vnstock/android/app/build/outputs/apk/release/app-release.apk
          workspace: apps/vnstock/.maestro
          env: |
            APP_ID=com.vnstock.staging

  download-and-test:
    name: Test Downloaded EAS APK
    if: inputs.test_mode == 'download_apk' && inputs.apk_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📥 Download EAS APK
        run: wget ${{ inputs.apk_url }} -O ./app-release.apk

      - name: 📦 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eas-test-apk
          path: ./app-release.apk
