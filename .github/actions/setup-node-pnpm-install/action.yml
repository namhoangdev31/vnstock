name: 'Setup Node + PNPM + Install Dependencies'
description: 'Sets up Node.js, pnpm, and installs cached dependencies for the mobile app'

inputs:
  working-directory:
    description: 'Working directory for pnpm'
    required: false
    default: 'apps/vnstock'
  node-version:
    description: 'Node version'
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: 📦 Setup PNPM
      uses: pnpm/action-setup@v4
      with:
        run_install: false

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: 📦 Install Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
