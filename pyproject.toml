[dependency-groups]
dev = [
  "pandas-stubs~=2.3.3",
  "prek>=0.5.2,<1.0.0",
  "typer>=0.27.2,<1.0.0",
]

[tool.ty.environment]
python = ".venv"
python-version = "3.12"

[tool.typos.files]
extend-exclude = [
  "img/",
  "uv.lock",
  "bun.lock",
  "backend/coverage/",
  "backend/htmlcov/",
  "backend/app/frontend/",
  "frontend/dist/",
  "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
  "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
  "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.uv.workspace]
members = ["backend"]
