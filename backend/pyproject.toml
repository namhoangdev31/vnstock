[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.12,<4.0"
dependencies = [
  "alembic>=1.19.1,<2.0.0",
  "email-validator<3.0.0.0,>=2.1.0.post1",
  "emails>=1.1.2,<2.0",
  "fastapi[standard]>=0.141.1,<1.0.0",
  "httpx<1.0.0,>=0.25.1",
  "jinja2<4.0.0,>=3.1.4",
  "pandas>=2.0",
  "psycopg[binary]>=3.3.5,<4.0.0",
  "pwdlib[argon2,bcrypt]>=0.3.1",
  "pydantic>=2.13.5",
  "pydantic-settings<3.0.0,>=2.2.1",
  "pyjwt<3.0.0,>=2.13.0",
  "python-multipart<1.0.0,>=0.0.27",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "sentry-sdk[fastapi]>=2.69.1,<3.0.0",
  "sqlmodel>=0.0.39,<1.0.0",
  "vnstock>=4.0.6",
]

[dependency-groups]
dev = [
  "coverage<8.0.0,>=7.4.3",
  "mypy<3.0.0,>=1.8.0",
  "pytest<10.0.0,>=7.4.3",
  "ruff<1.0.0,>=0.2.2",
  "ty>=0.0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.fastapi]
entrypoint = "app.main:app"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG001",  # unused arguments in functions
  "T201",  # print statements are not allowed
]
ignore = [
  "E501",  # line too long, handled by black
  "B008",  # do not perform function calls in argument defaults
  "W191",  # indentation contains tabs
  "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]
"tests/*" = ["T201"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.environment]
python = "../.venv"
python-version = "3.12"
